<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTAFITI: Africa's Research Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#21164A;--gold:#C8A84E;--paper:#F7F6F2;--charcoal:#202124;--green:#147D68;--orange:#D66A35;
  --bg:#F7F6F2;--surface:#FFFFFF;--raised:#FBFAF7;--ink:#202124;--muted:#62606B;--faint:#8E8B96;--line:#E6E3DA;--tint:#EFEDE6;
  --accent:#21164A;--on-accent:#FFFFFF;--gold-ink:#8A6D1C;--green-ink:#147D68;--orange-ink:#B5532A;
  --side:#21164A;--side-ink:#EDE9F8;--side-muted:#A79FC8;
  --shadow:0 1px 2px rgba(33,22,74,.05),0 8px 24px -12px rgba(33,22,74,.12);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15102C;--surface:#1D1740;--raised:#221B49;--ink:#F2EFF8;--muted:#B4ADCB;--faint:#8B83A8;--line:#2F2760;--tint:#282057;
    --accent:#C8A84E;--on-accent:#21164A;--gold-ink:#E1C674;--green-ink:#4FC2A8;--orange-ink:#F0936A;
    --side:#0F0A22;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#15102C;--surface:#1D1740;--raised:#221B49;--ink:#F2EFF8;--muted:#B4ADCB;--faint:#8B83A8;--line:#2F2760;--tint:#282057;
  --accent:#C8A84E;--on-accent:#21164A;--gold-ink:#E1C674;--green-ink:#4FC2A8;--orange-ink:#F0936A;
  --side:#0F0A22;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.15}
h2{font-size:24px}h3{font-size:18px}
p{margin:0}
a{color:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:22px 12px 20px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 6px;background:none;border:0;cursor:pointer;text-align:left;color:inherit}
.brand strong{font-family:var(--serif);font-size:21px;letter-spacing:.08em;display:block;line-height:1}
.brand small{display:block;font-size:11.5px;color:var(--side-muted);margin-top:4px;letter-spacing:.01em}
.navgroup{display:flex;flex-direction:column;gap:1px}
.navgroup h4{margin:0 0 4px;padding:0 12px;font:600 11.5px/1.4 var(--sans);color:var(--side-muted);letter-spacing:.02em}
.nav{background:none;border:0;color:var(--side-ink);text-align:left;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav:hover{background:rgba(255,255,255,.06)}
.nav[aria-current=page]{background:rgba(200,168,78,.16);color:#fff}
.nav[aria-current=page]::before{content:"";width:3px;height:16px;background:var(--gold);border-radius:2px;margin-left:-8px;margin-right:2px}
.nav em{font-style:normal;font-size:11px;background:var(--gold);color:var(--indigo);padding:1px 6px;border-radius:9px;font-weight:700}
.nav .lbl{flex:1}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding:0 12px;line-height:1.5}

.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 36px;border-bottom:1px solid var(--line)}
.menu{display:none;background:none;border:0;padding:6px;cursor:pointer}
.gsearch{flex:1;max-width:620px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 12px;height:40px}
.gsearch:focus-within{border-color:var(--gold)}
.gsearch input{flex:1;border:0;background:none;outline:none;min-width:0;height:100%}
.gsearch kbd{font:12px var(--sans);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--indigo);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;border:0;cursor:pointer}
:root[data-theme="dark"] .avatar{background:var(--gold);color:var(--indigo)}

main{padding:30px 36px 80px;max-width:1180px;width:100%}
.phead{margin-bottom:24px;max-width:70ch}
.phead h1{font-size:34px}
.phead p{color:var(--muted);margin-top:6px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--gold-ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- primitives ---------- */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.12)}
.btn.on{background:var(--tint);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--gold-ink);padding-left:4px;padding-right:4px}
.btn.ghost:hover{text-decoration:underline;text-underline-offset:3px}
.btn.sm{padding:5px 10px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:6px;background:var(--tint);color:var(--ink);border:0;line-height:1.5}
button.chip{cursor:pointer}button.chip:hover{outline:1px solid var(--gold)}
.chip.g{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green-ink)}
.chip.o{background:color-mix(in srgb,var(--orange) 13%,transparent);color:var(--orange-ink)}
.chip.y{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--muted)}.small{font-size:13px}.faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.panel{background:var(--surface);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.panel.flat{box-shadow:none;background:var(--raised);border:1px solid var(--line)}
.sec{margin-top:34px}
.sec>.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec>.sh p{color:var(--muted);font-size:13.5px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.seg{display:inline-flex;background:var(--tint);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button i{font-style:normal;color:var(--faint);margin-left:5px;font-size:12px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.score{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--green-ink);line-height:1}
.score small{font:500 11.5px var(--sans);color:var(--muted);display:block;margin-top:3px}
.ring{--v:80;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--v)*1%),var(--tint) 0);display:grid;place-items:center;flex-shrink:0}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13.5px;color:var(--green-ink)}
.meter{height:8px;background:var(--tint);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .3s}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 58px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.bar .bt{height:9px;background:var(--tint);border-radius:5px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--indigo);border-radius:5px}
:root[data-theme="dark"] .bar .bt i{background:#8F7FE0}
.bar .bt i.g{background:var(--gold)}.bar .bt i.t{background:var(--green)}
.bar .bv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:14px;height:6px;border-radius:2px;background:var(--tint)}
.lvl.l1 i:nth-child(-n+1),.lvl.l2 i:nth-child(-n+2),.lvl.l3 i:nth-child(-n+3){background:currentColor}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.check input{margin-top:3px;accent-color:var(--green);width:16px;height:16px}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--tint);border-radius:20px;padding:3px 10px}
.src i{width:7px;height:7px;border-radius:50%;background:var(--green)}
svg text{fill:var(--muted);font-family:var(--sans)}

/* ---------- home ---------- */
.hero{padding:26px 0 8px;max-width:820px}
.hero h1{font-size:clamp(34px,5.2vw,58px);line-height:1.02;letter-spacing:-.03em;font-weight:600}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){padding-left:.6em}
.hero h1 span:nth-child(3){padding-left:1.2em;color:var(--gold-ink)}
.hero .sub{font-size:16.5px;color:var(--muted);margin:18px 0 22px;max-width:56ch}
.bigsearch{display:flex;gap:8px;background:var(--surface);border-radius:14px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);border:1px solid var(--line);align-items:center}
.bigsearch:focus-within{border-color:var(--gold)}
.bigsearch input{flex:1;border:0;outline:none;background:none;font-size:17px;min-width:0;padding:8px 0}
.try{margin-top:12px;font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:34px}
.door{background:var(--surface);border-radius:14px;padding:20px;text-align:left;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-height:190px}
.door:hover{border-color:var(--gold)}
.door .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;margin-bottom:6px}
.door h3{font-size:20px}
.door .fig{font-size:13px;font-weight:600;color:var(--gold-ink)}
.door p{font-size:13.5px;color:var(--muted);flex:1}
.door .go{font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--gold)}
.brief{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:22px;margin-top:40px;align-items:start}
.greet h2{font-size:28px}
.tally{margin-top:16px;display:flex;flex-direction:column}
.tally button{display:flex;align-items:baseline;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;text-align:left;cursor:pointer}
.tally button:hover span{color:var(--gold-ink)}
.tally b{font-family:var(--serif);font-size:26px;min-width:34px;font-variant-numeric:tabular-nums}
.tally span{font-size:14.5px}
.recs{display:flex;flex-direction:column;gap:12px}
.recitem{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.recitem .kind{font-size:12px;color:var(--muted)}
.recitem b{display:block;font-size:15px}
.recitem .body{flex:1;min-width:0}

/* ---------- intelligence card ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.icard{background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--kc,var(--indigo))}
.icard .kind{font-size:12px;color:var(--kc,var(--muted));font-weight:600}
.icard h3{font-size:18px;margin-top:2px}
.icard .sub{font-size:13.5px;color:var(--muted);margin-top:3px}
.icard .stats{display:flex;gap:18px;flex-wrap:wrap}
.icard .stats div{font-size:12px;color:var(--muted)}
.icard .stats b{display:block;font:700 19px/1.1 var(--serif);color:var(--ink)}
.icard .rows{display:flex;flex-direction:column;gap:8px}
.icard .rows>div>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.icard .acts{display:flex;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.icard .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.k-researcher{--kc:#21164A}.k-institution{--kc:#5B4BB0}.k-publication{--kc:#8A6D1C}.k-dataset{--kc:#147D68}
.k-project{--kc:#D66A35}.k-grant{--kc:#147D68}.k-method{--kc:#62606B}.k-infrastructure{--kc:#3C6E9E}.k-company{--kc:#B5532A}
:root[data-theme="dark"] .k-researcher{--kc:#A99BF0}:root[data-theme="dark"] .k-institution{--kc:#8F7FE0}:root[data-theme="dark"] .k-publication{--kc:#E1C674}:root[data-theme="dark"] .k-dataset,:root[data-theme="dark"] .k-grant{--kc:#4FC2A8}:root[data-theme="dark"] .k-project{--kc:#F0936A}:root[data-theme="dark"] .k-method{--kc:#B4ADCB}:root[data-theme="dark"] .k-infrastructure{--kc:#7FB2E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-researcher{--kc:#A99BF0}:root:not([data-theme="light"]) .k-institution{--kc:#8F7FE0}:root:not([data-theme="light"]) .k-publication{--kc:#E1C674}:root:not([data-theme="light"]) .k-dataset,:root:not([data-theme="light"]) .k-grant{--kc:#4FC2A8}:root:not([data-theme="light"]) .k-project{--kc:#F0936A}:root:not([data-theme="light"]) .k-infrastructure{--kc:#7FB2E0}}

/* ---------- search ---------- */
.facets{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:24px}
.facet{background:var(--surface);border-radius:12px;padding:14px;text-align:left;border:1px solid transparent;cursor:pointer;box-shadow:var(--shadow)}
.facet:hover,.facet[aria-pressed=true]{border-color:var(--gold)}
.facet b{display:block;font:700 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.facet span{font-size:12.5px;color:var(--muted)}
.group{margin-bottom:30px}
.group .gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.callout{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--indigo);color:#F3EFFD;border-radius:14px;padding:18px 22px;margin-bottom:26px;flex-wrap:wrap}
.callout b{font-family:var(--serif);font-size:20px;display:block;color:#fff}
.callout p{color:#CBC2EA;font-size:13.5px}
.callout .btn.pri{background:var(--gold);color:var(--indigo);border-color:var(--gold)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(18,12,40,.42);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow:auto;padding:24px 26px calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
body.dopen .scrim{display:block}
body.dopen .drawer{transform:none;visibility:visible;transition:transform .25s ease}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.dclose{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;flex-shrink:0;font-size:18px;line-height:1}
.dsec{margin-top:20px}
.dsec h4{font:600 13px var(--sans);color:var(--muted);margin:0 0 8px}

/* ---------- observatory ---------- */
.theme{display:grid;grid-template-columns:minmax(0,1fr) 110px 70px;gap:14px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.theme:hover b{color:var(--gold-ink)}
.theme b{font-weight:600;font-size:15px}
.theme .up{font-weight:700;color:var(--green-ink);text-align:right;font-variant-numeric:tabular-nums}
.theme .up.hot{color:var(--orange-ink)}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.hexmap .hx{cursor:pointer}
.hexmap .hx:hover polygon{stroke:var(--gold);stroke-width:2.5}
.hexmap .hx.sel polygon{stroke:var(--ink);stroke-width:3}
.hexmap text{pointer-events:none;font-size:11px;font-weight:600}
.cstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.cstat div{font-size:12.5px;color:var(--muted)}
.cstat b{display:block;font:700 24px/1.15 var(--serif);color:var(--ink)}
.gapq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.gapq .panel h3{font-size:16.5px;margin-bottom:8px}
.pair{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* ---------- radar ---------- */
.feed{display:flex;flex-direction:column}
.fitem{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px 4px;border-bottom:1px solid var(--line)}
.fitem .t{font-size:12.5px;font-weight:600}
.fitem b{display:block;font-size:15.5px;margin-bottom:2px}
.fitem p{font-size:13.5px;color:var(--muted)}

/* ---------- gap finder / funding ---------- */
.ask{display:flex;gap:10px;align-items:stretch}
.ask .inp{font-size:16px;padding:12px 14px}
.gap{background:var(--surface);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}
.gap+.gap{margin-top:14px}
.gap h3{font-size:19px;margin-bottom:6px}
.sig{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13px;align-items:center}
.sig .lo{color:var(--orange-ink)}.sig .md{color:var(--gold-ink)}.sig .hi{color:var(--green-ink)}
.grant{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grant+.grant{margin-top:10px}
.grant .body{flex:1;min-width:0}
.grant b{font-size:15.5px;display:block}
.grant .meta{font-size:13px;color:var(--muted);margin-top:2px}
.intel{display:flex;flex-direction:column;gap:0}
.intel .ii{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.intel .ii b{font:700 20px var(--serif)}
.why{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.why li{display:flex;gap:8px;align-items:center;font-size:14px;background:var(--raised);border-radius:8px;padding:8px 10px}
.why .ok{color:var(--green-ink);font-weight:700}.why .no{color:var(--faint);font-weight:700}
.countdown{font:700 40px/1 var(--serif)}
.person{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.person .av{width:38px;height:38px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--ink)}
.person .body{flex:1;min-width:0}
.person b{display:block;font-size:14.5px}
.person span{font-size:12.5px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;font-size:14px;position:relative}
.tl time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tl li.past{color:var(--faint);text-decoration:line-through}

/* ---------- passport ---------- */
.pass{background:var(--indigo);color:#F3EFFD;border-radius:16px;padding:26px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;position:relative;overflow:hidden}
.pass::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(200,168,78,.12)}
.pass .pav{width:74px;height:74px;border-radius:50%;background:var(--gold);color:var(--indigo);display:grid;place-items:center;font:700 26px var(--serif)}
.pass h2{color:#fff;font-size:28px}
.pass p{color:#CBC2EA;font-size:14px;margin-top:4px}
.pass .pid{font-size:12px;color:#A79FC8;margin-top:10px;letter-spacing:.03em}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}
.pgrid .panel h3{font-size:17px;margin-bottom:10px}

/* ---------- watch / saturday ---------- */
.series{display:flex;flex-direction:column;gap:10px}
.issue{border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.issue b{display:block;font-size:14.5px;margin-bottom:2px}
.agenda{list-style:none;padding:0;margin:14px 0 0}
.agenda li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.agenda time{font-weight:600;color:var(--gold-ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- responsive ---------- */
@media (max-width:1080px){.doors{grid-template-columns:repeat(2,minmax(0,1fr))}.facets{grid-template-columns:repeat(4,minmax(0,1fr))}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .25s;height:100%;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  body.nopen .side{transform:none}
  body.nopen .scrim{display:block}
  .menu{display:block}
  .topbar{padding:10px 16px;top:env(safe-area-inset-top,0px)}
  main{padding:22px 16px 60px}
  .split,.brief,.mapwrap,.g2,.gap,.gapq{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .gsearch kbd{display:none}
}
@media (max-width:620px){
  .doors,.pgrid{grid-template-columns:1fr}
  .facets{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fitem{grid-template-columns:1fr}
  .pass{grid-template-columns:1fr}
  .why{grid-template-columns:1fr}
  .bar{grid-template-columns:110px 1fr 48px}
  .ask{flex-direction:column}
  .hero h1 span:nth-child(2),.hero h1 span:nth-child(3){padding-left:0}
  #theme{display:none}
  .topbar{gap:8px}
}
@media print{.side,.topbar,.drawer,.scrim{display:none!important}.app{display:block}main{padding:0}}

/* =========================================================

   ========================================================= */
const STOP=new Set('the and for with in of on a an to my is about research based using what under researched how are which who where into from by at or our this that than more most africa african'.split(' '));
const toks=s=>String(s).toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>=2&&!STOP.has(t));
const norm=t=>t.length>5?t.slice(0,5):t;
function overlap(qt,text){const tt=new Set(toks(text).map(norm));return qt.filter(q=>tt.has(norm(q))).length}
const TEXT={
 researcher:r=>[r.name,r.inst,r.country,r.field,r.areas.join(' '),r.caps.join(' ')].join(' '),
 institution:i=>[i.name,i.country,i.caps.join(' ')].join(' '),
 publication:p=>[p.title,p.venue,p.topics.join(' '),p.authors].join(' '),
 project:p=>[p.title,p.lead,p.topics.join(' ')].join(' '),
 dataset:d=>[d.title,d.type,d.topics.join(' ')].join(' '),
 grant:g=>[g.title,g.funder,g.themes.join(' '),g.kw.join(' ')].join(' '),
 method:m=>[m.title,m.summary,m.topics.join(' ')].join(' ')
};
const SETS={researcher:RESEARCHERS,institution:INSTITUTIONS,publication:PUBS,project:PROJECTS,dataset:DATASETS,grant:GRANTS,method:METHODS};
const LABEL={researcher:'Researchers',institution:'Institutions',publication:'Publications',project:'Projects',dataset:'Datasets',grant:'Grants',method:'Methods'};
const MULT={researcher:118,institution:4,publication:720,project:14,dataset:6,grant:4,method:6};
function runSearch(q){
 const qt=toks(q),h=hash(q.toLowerCase()),out={};
 for(const k in SETS){
  const hits=SETS[k].map(x=>({x,s:overlap(qt,TEXT[k](x))})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s);
  const count=hits.length?hits.length*MULT[k]+(h%(MULT[k]*3))+hits.reduce((a,o)=>a+o.s,0):0;
  out[k]={hits:hits.map(o=>o.x),count};
 }
 return out;
}
function detectDomain(q){
 const qt=toks(q);let best='open',bs=0;
 for(const k in DOMAINS){const s=qt.filter(t=>DOMAINS[k].m.some(m=>t.startsWith(m)||m.startsWith(norm(t)))).length;if(s>bs){bs=s;best=k}}
 if(bs===0&&qt.some(t=>t==='ai'||t.startsWith('machi')||t.startsWith('model')))best='language';
 return best;
}
const GENERIC=new Set(['ai','africa','data','machine','learning','digital']);
function grantFit(g,q){
 const qt=toks(q);const m=qt.filter(t=>g.kw.some(k=>norm(k)===norm(t))).reduce((a,t)=>a+(GENERIC.has(t)?.5:1),0);
 return m?Math.min(97,Math.round(44+m*12+(hash(g.id+q)%5))):18+hash(g.id+q)%20;
}

/* Ego network for the researcher passport */
function ego(r){
 const links=[['Institution',r.inst],...(PUBS.filter(p=>p.authors.includes(r.name.split(' ').pop())).slice(0,2).map(p=>['Publication',p.title])),
  ...(DATASETS.filter(d=>d.topics.some(t=>r.areas.includes(t))).slice(0,1).map(d=>['Dataset',d.title])),
  ...(PROJECTS.filter(p=>p.lead===r.name).map(p=>['Project',p.title])),['Collaborator',r.collab[0]]];
 const C={Institution:'#5B4BB0',Publication:'#C8A84E',Dataset:'#147D68',Project:'#D66A35',Collaborator:'#8E8B96'};
 const cx=250,cy=150,rx=120,ry=100;let s=`<svg viewBox="-20 0 540 300" width="100%" role="img" aria-label="Connections of ${esc(r.name)}">`;
 const pts=links.map(([t,l],i)=>{const a=-Math.PI/2+(i+.5)*2*Math.PI/links.length;return{t,l:l.length>24?l.slice(0,22)+'\u2026':l,a,x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}});
 pts.forEach(p=>s+=`<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="var(--line)" stroke-width="2"/>`);
 pts.forEach(p=>{const c=Math.cos(p.a),an=c>.2?'start':c<-.2?'end':'middle',dx=c>.2?12:c<-.2?-12:0,ty=Math.abs(c)>.2?p.y+4:p.y+(Math.sin(p.a)<0?-14:22);
  s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8" fill="${C[p.t]}"/><text x="${(p.x+dx).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${an}" font-size="11" style="fill:var(--ink)">${esc(p.l)}</text>`});
 return s+`<circle cx="${cx}" cy="${cy}" r="30" fill="var(--accent)"/><text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--on-accent)">${ini(r.name)}</text></svg>`;
}

function searchView(){

 if(!q)return head('Search UTAFITI','Search once across researchers, papers, projects, datasets, grants and methods.')+`<div class="empty">Type a topic in the search bar, for example <button class="chip" data-go="search/AI in African healthcare">AI in African healthcare</button></div>`;
 const R=runSearch(q),order=['researcher','institution','publication','project','dataset','grant','method'];
 const total=order.reduce((a,k)=>a+R[k].count,0);
 if(!total)return head(`No results for \u201c${esc(q)}\u201d`,'')+`<div class="empty">Nothing in the graph matches these words yet. Try a broader topic, or check the spelling. You can also <button class="btn sm" data-go="saturday">add a missing record at Research Saturday</button></div>`;

 return head(`\u201c${esc(q)}\u201d`,`${fmt(total)} connected records across the Research Graph. Select a count to focus on one type.`)+facets+fund+groups;
}

function hexmap(){
 const s=24,w=Math.sqrt(3)*s,px=w/2+6,py=s+6,m=state.obsMetric;
 const vals=COUNTRIES.map(c=>cstat(c[0])[[0,2,4][m]]),mx=Math.max(...vals),mn=Math.min(...vals);
 const W=px*2+w*7.5,H=py*2+1.5*s*7;
 let out=`<svg class="hexmap" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="100%" role="img" aria-label="Tile map of African countries">`;
 COUNTRIES.forEach(([code,name,col,row],i)=>{
  const x=px+col*w+(row%2?w/2:0),y=py+row*1.5*s,t=(vals[i]-mn)/(mx-mn),pts=[];
  for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);pts.push(`${(x+s*Math.cos(a)).toFixed(1)},${(y+s*Math.sin(a)).toFixed(1)}`)}
  const fill=`color-mix(in srgb,${m===2?'var(--green)':'var(--indigo)'} ${Math.round(14+Math.sqrt(t)*80)}%,var(--surface))`;
  out+=`<g class="hx ${state.country===code?'sel':''}" data-act="country:${code}" tabindex="0" role="button" aria-label="${name}"><polygon points="${pts.join(' ')}" fill="${fill}" stroke="var(--bg)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" style="fill:${t>.45?'#fff':'var(--ink)'}">${code}</text></g>`;
 });
 return out+'</svg>';
}
function lineChart(){
 const W=700,H=280,p={l:40,r:48,t:14,b:30},Y=[2019,2020,2021,2022,2023,2024,2025],cols=['#D66A35','#147D68','#C8A84E','#5B4BB0','#3C6E9E','#8E8B96'];
 const vis=THEMES.map((t,i)=>[t,i]).filter(([,i])=>!state.hidden.has(i));
 const ymax=Math.ceil(Math.max(200,...vis.flatMap(([t])=>t[2]))/100)*100,ymin=100;
 const x=i=>p.l+i*(W-p.l-p.r)/6,y=v=>H-p.b-(v-ymin)/(ymax-ymin)*(H-p.t-p.b);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Output by theme indexed to 2019">`;
 for(let v=ymin;v<=ymax;v+=100)s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11">${v}</text>`;
 Y.forEach((yr,i)=>s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11">${yr}</text>`);
 let lastY=-99;const ends=vis.map(([t,i])=>[t,i]).sort((a,b)=>b[0][2][6]-a[0][2][6]);const show=new Set();ends.forEach(([t,i])=>{const yy=y(t[2][6]);if(yy-lastY>13){show.add(i);lastY=yy}});
 vis.forEach(([t,i])=>{s+=`<polyline fill="none" stroke="${cols[i]}" stroke-width="2.5" stroke-linejoin="round" points="${t[2].map((v,j)=>`${x(j)},${y(v)}`).join(' ')}"/>`;const lv=t[2][6];s+=`<circle cx="${x(6)}" cy="${y(lv)}" r="4" fill="${cols[i]}"/>`;if(show.has(i))s+=`<text x="${x(6)+8}" y="${y(lv)+4}" font-size="11" font-weight="700" style="fill:var(--ink)">${lv}</text>`});
 return {svg:s+'</svg>',cols};
}
function collabNet(){

}

const toggle=(set,k)=>set.has(k)?set.delete(k):set.add(k);
const ACT={
 sfacet:k=>{state.sfacet=k},
 disc:k=>{go('discover/'+k);return false},
 metric:k=>{state.obsMetric=+k},
 country:k=>{state.country=k},

 book:k=>{toggle(state.booked,+k)},

 wsdone:k=>{const [g,i]=k.split(':');toggle(state.ws[g].done,+i)},
 mproj:k=>{state.matchProj=+k},

};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-act]');if(!t)return;
 if(t.dataset.go!=null){e.preventDefault();closeDrawer();state.sfacet='all';go(t.dataset.go);return}
 const [a,...b]=t.dataset.act.split(':');
 if(!ACT[a])return;
 if(ACT[a](b.join(':'))!==false)render(true);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeDrawer();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
 if(e.key==='/'&&!e.target.matches('input,textarea,select')){e.preventDefault();$('#tq').focus()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='dq'){const v=e.target.value.toLowerCase();document.querySelectorAll('#dcards .icard').forEach(c=>c.hidden=!c.textContent.toLowerCase().includes(v))}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const id=e.target.id;
 if(id==='topSearch'||id==='heroSearch'){const v=(id==='topSearch'?$('#tq'):$('#hq')).value.trim();if(v){state.sfacet='all';go('search/'+v)}}
 if(id==='gapForm'){state.gapQ=$('#gq').value.trim()||state.gapQ;render(true)}
 if(id==='fiForm'){state.fiQ=$('#fq').value.trim()||state.fiQ;render(true);toast('Funding matches updated')}
 if(id==='impactForm'){const v=$('#idesc').value.trim();if(v){state.impact.unshift([$('#it').value,v]);render(true)}}
 if(id==='satForm'){const v=$('#sn').value.trim();if(v){state.contribs.unshift([$('#st').value,v]);render(true);toast('Submitted for peer check')}}
});
$('#scrim').addEventListener('click',closeDrawer);
$('#menu').addEventListener('click',()=>document.body.classList.toggle('nopen'));
$('#theme').addEventListener('click',()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'});
window.addEventListener('hashchange',()=>{parse();render()});
parse();render();
</script>
</body>
</html>
